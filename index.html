<meta name="theme-color" content="#006241">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>تميم كافيه - 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #006241;        /* أخضر ستاربكس الغامق */
            --primary-light: #00704A;   /* أخضر ستاربكس الفاتح */
            --secondary: #D4E9E2;       /* أخضر مائي فاتح جداً */
            --accent: #00A862;          /* أخضر زاهي للتميز */
            --bg: #F7F7F5;              /* أبيض مائل للرمادي - خلفية نظيفة */
            --card-bg: #FFFFFF;         /* أبيض نقي للكروت */
            --text-dark: #1E3932;       /* أخضر داكن جداً للنصوص */
            --text-light: #5F5F5F;      /* رمادي للنصوص الثانوية */
            --offer-red: #D62B3F;       /* أحمر ستاربكس للعروض */
            --gold: #CBA258;            /* ذهبي للتميز */
            --border: #E0E0E0;          /* رمادي فاتح للحدود */
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            font-family: 'Tajawal', sans-serif; 
            padding-bottom: 100px; 
            overflow-x: hidden;
            color: var(--text-dark);
        }
        
        /* الهيدر */
        header { 
            background: var(--primary); 
            color: white; 
            padding: 8px 20px; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 65px; 
            z-index: 3000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 15px rgba(0,98,65,0.3);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 42px; 
            height: 42px; 
            background: white; 
            color: var(--primary); 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            font-size: 22px; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .logo-text {
            margin:0; 
            font-size:20px; 
            font-weight:900;
            letter-spacing: 1px;
        }
        
        .header-left { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        
        .icon-btn { 
            background: rgba(255, 255, 255, 0.15); 
            border: 1.5px solid white; 
            color: white; 
            width: 42px; 
            height: 42px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 16px;
            transition: all 0.2s ease;
        }
        
        .icon-btn:active {
            background: white;
            color: var(--primary);
        }

        /* المحتوى الرئيسي */
        .main-wrapper { 
            margin-top: 65px; 
        }
        
        /* ===== شريط التبويبات الرئيسي ===== */
        .nav-container { 
            position: sticky; 
            top: 65px; 
            z-index: 2000; 
            background: white; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 8px 0 4px;
        }
        
        .tabs-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding: 0 15px;
            margin: 0 auto;
            max-width: 100%;
            direction: rtl;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .tabs-scroll::-webkit-scrollbar {
            display: none;
        }

        .tabs-wrapper {
            display: inline-flex;
            gap: 8px;
            padding: 3px 0 8px;
            min-width: 100%;
            justify-content: flex-start;
        }

        .tab-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 16px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .tab-item i {
            font-size: 14px;
            color: var(--gold);
        }

        .tab-item:hover {
            background: #f5f5f5;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .tab-item.active {
            background: var(--primary);
            border-color: var(--gold);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(0,98,65,0.2);
        }

        .tab-item.active i {
            color: white;
        }

        /* ===== القوائم الفرعية ===== */
        .subcategories-container {
            background: white;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            direction: rtl;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--secondary);
            
            max-height: 0;
            opacity: 0;
            padding: 0 15px;
            margin-top: 0;
            border-width: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .subcategories-container::-webkit-scrollbar {
            height: 3px;
        }

        .subcategories-container::-webkit-scrollbar-track {
            background: var(--secondary);
            border-radius: 3px;
        }

        .subcategories-container::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 3px;
        }

        .subcategories-container.visible {
            max-height: 60px;
            opacity: 1;
            padding: 6px 15px;
            margin-top: 6px;
            border-top: 1px solid var(--secondary);
            border-bottom: 1px solid var(--secondary);
            pointer-events: all;
        }

        .subcategory-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 14px;
            margin: 0 3px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .subcategory-item i {
            font-size: 12px;
            color: var(--gold);
        }

        .subcategory-item:hover {
            background: var(--secondary);
            border-color: var(--primary);
        }

        .subcategory-item.active {
            background: var(--primary);
            border-color: var(--gold);
            color: white;
        }

        .subcategory-item.active i {
            color: white;
        }

        /* كروت الأصناف */
        .item-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 15px 18px; 
            margin: 0 15px 15px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            opacity: 0; 
            transform: translateY(20px);
            animation: cascadeIn 0.4s ease forwards;
        }
        
        @keyframes cascadeIn { 
            to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }

        .item-img {
            width: 70px; 
            height: 70px; 
            border-radius: 16px; 
            object-fit: cover;
            margin-left: 15px; 
            flex-shrink: 0;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,98,65,0.1);
        }

        .item-card > div:first-child {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
        }
        
        .item-card h3 {
            margin: 0 0 5px 0;
            font-size: 17px !important;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.3;
        }
        
        .item-desc {
            font-size: 13px;
            color: var(--text-light);
            max-width: 160px;
            line-height: 1.4;
            margin: 0;
        }

        .price-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 140px;
        }
        
        .price-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        
        .price-btn { 
            background: var(--card-bg); 
            border: 2px solid var(--primary); 
            border-radius: 14px; 
            height: 55px; 
            min-width: 75px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            position: relative;
            transition: all 0.15s ease;
        }
        
        .price-btn:active {
            transform: scale(0.95);
            background: var(--primary);
            color: white;
        }
        
        .price-btn.selected { 
            background: var(--primary) !important; 
            border-color: var(--primary) !important;
            color: white !important;
        }
        
        .price-btn span:first-of-type {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 2px;
        }
        
        .price-btn span:last-of-type {
            font-size: 16px;
            font-weight: 900;
        }
        
        .item-card select {
            margin-bottom: 10px;
            border-radius: 12px;
            border: 2px solid var(--border);
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            width: 100%;
            padding: 8px 12px;
            height: auto;
            background: var(--bg);
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
        }
        
        .size-badge { 
            position: absolute; 
            top: -12px; 
            left: -12px; 
            background: var(--gold); 
            color: var(--text-dark); 
            width: 26px; 
            height: 26px; 
            border-radius: 50%; 
            font-size: 13px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid white; 
            font-weight: 900; 
            z-index: 10;
        }

        /* شريط السلة */
        .cart-bar { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 92%; 
            max-width: 420px; 
            background: var(--primary); 
            color: white; 
            padding: 16px 24px; 
            border-radius: 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 4000; 
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0,98,65,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .cart-count {
            background: var(--gold); 
            color: var(--text-dark); 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            font-size: 15px;
        }
        
        .cart-total {
            font-weight: 900; 
            font-size: 22px;
        }
        
        /* النافذة المنبثقة */
        .modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,98,65,0.8); 
            display: none; 
            z-index: 5000; 
            align-items: flex-end; 
            backdrop-filter: blur(4px);
        }
        
        .modal-content { 
            background: var(--card-bg); 
            width: 100%; 
            border-radius: 30px 30px 0 0; 
            padding: 25px; 
            max-height: 80vh; 
            overflow-y: auto; 
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .cart-item-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            color: var(--text-dark);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cart-item-btn:active {
            background: var(--secondary);
            border-color: var(--primary);
        }

        /* ===== سبـلاش في المنتصف تماماً ===== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: linear-gradient(145deg, #1a4d3e 0%, #006241 50%, #00704A 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }

        .splash-content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .splash-logo-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.3);
            animation: ringPulse 3s infinite;
        }

        .ring:nth-child(1) {
            width: 240px;
            height: 240px;
            animation-delay: 0s;
        }

        .ring:nth-child(2) {
            width: 260px;
            height: 260px;
            animation-delay: 0.5s;
        }

        .ring:nth-child(3) {
            width: 280px;
            height: 280px;
            animation-delay: 1s;
        }

        .ring:nth-child(4) {
            width: 300px;
            height: 300px;
            animation-delay: 1.5s;
        }

        @keyframes ringPulse {
            0% {
                border-color: rgba(255, 215, 0, 0.1);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                border-color: rgba(255, 215, 0, 0.5);
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                border-color: rgba(255, 215, 0, 0.1);
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .splash-logo {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #FFD966 0%, #CBA258 100%);
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.3),
                0 0 0 8px rgba(255,215,0,0.2),
                0 0 0 16px rgba(255,215,0,0.1);
            transform: rotate(5deg);
            animation: logoFloat 3s infinite;
            margin: 0 auto;
        }

        @keyframes logoFloat {
            0%, 100% { transform: rotate(5deg) translateY(0); }
            50% { transform: rotate(5deg) translateY(-10px); }
        }

        .splash-logo span {
            font-size: 110px;
            font-weight: 900;
            color: #006241;
            transform: rotate(-5deg);
            animation: letterPulse 2s infinite;
            line-height: 1;
        }

        @keyframes letterPulse {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(-5deg) scale(1.1); }
        }

        .splash-title {
            color: white;
            font-size: 52px;
            font-weight: 900;
            margin: 15px 0 5px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out 0.3s both;
            text-align: center;
        }

        .splash-subtitle {
            color: #FFD966;
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 25px;
            animation: fadeIn 0.8s ease-out 0.6s forwards;
            opacity: 0;
            text-align: center;
        }

        .splash-loader {
            width: 280px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            margin: 10px auto 0;
            overflow: hidden;
            position: relative;
        }

        .splash-loader-bar {
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #FFD966, #CBA258);
            position: absolute;
            left: -40%;
            animation: loaderMove 1.5s ease-in-out infinite;
            border-radius: 6px;
        }

        @keyframes loaderMove {
            0% { left: -40%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .tab-item { padding: 5px 12px; font-size: 13px; }
            .tab-item i { font-size: 12px; }
            .subcategory-item { padding: 4px 12px; font-size: 12px; }
            .subcategory-item i { font-size: 11px; }
            
            .subcategories-container.visible {
                max-height: 55px;
                padding: 5px 12px;
            }
            
            .nav-container { padding: 6px 0 3px; }
            
            .splash-logo-wrapper { width: 180px; height: 180px; }
            .splash-logo { width: 160px; height: 160px; }
            .splash-logo span { font-size: 90px; }
            .ring:nth-child(1) { width: 200px; height: 200px; }
            .ring:nth-child(2) { width: 220px; height: 220px; }
            .ring:nth-child(3) { width: 240px; height: 240px; }
            .ring:nth-child(4) { width: 260px; height: 260px; }
            .splash-title { font-size: 42px; }
            .splash-subtitle { font-size: 18px; }
        }
    </style>
</head>
<body>

<!-- سبـلاش في المنتصف تماماً -->
<div id="splash-screen">
    <div class="splash-content">
        <div class="splash-logo-wrapper">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="splash-logo">
                <span>T</span>
            </div>
        </div>
        <h1 class="splash-title">تميم كافيه</h1>
        <div class="splash-subtitle">قهوة استثنائية • بورسعيد</div>
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>
</div>

<header>
    <div class="logo-container">
        <div class="logo-icon">T</div>
        <h1 class="logo-text">تميم كافيه</h1>
    </div>
    <div class="header-left">
        <button onclick="toggleLang()" id="langBtn" class="icon-btn">E</button>
        <button onclick="toggleFullScreen()" class="icon-btn"><i class="fas fa-expand-arrows-alt"></i></button>
    </div>
</header>

<div class="main-wrapper">
    <!-- شريط التبويبات الرئيسي -->
    <div class="nav-container">
        <div class="tabs-scroll" id="tabsScroll">
            <div class="tabs-wrapper" id="tabsWrapper"></div>
        </div>
        
        <!-- القوائم الفرعية -->
        <div class="subcategories-container" id="subcategoriesContainer">
            <div id="subcategoriesContent"></div>
        </div>
    </div>
    
    <!-- محتوى المنيو -->
    <div class="container" id="menuContent" style="padding: 15px 0;"></div>
</div>

<!-- شريط السلة -->
<div class="cart-bar" id="cartBar" onclick="openCart()">
    <div style="display:flex; align-items:center; gap:10px;">
        <span id="cartCount" class="cart-count">0</span>
        <span style="font-weight:600; font-size:15px;">المجموع:</span>
        <span id="cartTotal" class="cart-total">0</span>
        <span style="font-weight:500; font-size:15px;">ج.م</span>
    </div>
    <div style="font-weight:700; color:var(--gold); font-size:15px;">
        <i class="fas fa-shopping-bag" style="margin-right:6px;"></i>
        السلة
    </div>
</div>

    // ===== دوال التوسيط =====
    function centerActiveTab() {
        const scrollContainer = document.getElementById('tabsScroll');
        const activeTab = document.querySelector('.tab-item.active');
        
        if (activeTab && scrollContainer) {
            const containerWidth = scrollContainer.offsetWidth;
            const tabWidth = activeTab.offsetWidth;
            const tabLeft = activeTab.offsetLeft;
            const scrollTo = tabLeft - (containerWidth / 2) + (tabWidth / 2);
            
            scrollContainer.scrollTo({
                left: scrollTo,
                behavior: 'smooth'
            });
        }
    }

    function centerActiveSubCategory() {
        const container = document.querySelector('.subcategories-container');
        const activeSub = document.querySelector('.subcategory-item.active');
        
        if (activeSub && container && container.classList.contains('visible')) {
            const containerWidth = container.offsetWidth;
            const itemWidth = activeSub.offsetWidth;
            const itemLeft = activeSub.offsetLeft;
            
            const scrollTo = itemLeft - (containerWidth / 2) + (itemWidth / 2);
            
            container.scrollTo({
                left: scrollTo,
                behavior: 'smooth'
            });
        }
    }

    // ===== دوال الرسم =====
    function renderMainTabs() {
        const wrapper = document.getElementById('tabsWrapper');
        wrapper.innerHTML = mainCategories.map(cat => `
            <div class="tab-item ${cat.id === currentMainCat ? 'active' : ''}" 
                 onclick="changeMainCat('${cat.id}')">
                <i class="fas ${cat.icon}"></i>
                <span>${cat[currentLang]}</span>
            </div>
        `).join('');
        
        setTimeout(() => centerActiveTab(), 100);
    }

    function renderSubCategories() {
        const container = document.getElementById('subcategoriesContent');
        const subcategoriesContainer = document.getElementById('subcategoriesContainer');
        const subs = subCategories[currentMainCat] || [];
        
        if (!subs || subs.length === 0) {
            subcategoriesContainer.classList.remove('visible');
            container.innerHTML = '';
            return;
        }
        
        container.innerHTML = subs.map(item => `
            <div class="subcategory-item ${item.id === currentSubCat ? 'active' : ''}" 
                 onclick="changeSubCat('${item.id}')">
                <i class="fas ${item.icon}"></i>
                ${item[currentLang]}
            </div>
        `).join('');
        
        subcategoriesContainer.classList.add('visible');
        
        setTimeout(() => centerActiveSubCategory(), 150);
    }

    function changeMainCat(catId) {
        currentMainCat = catId;
        const subs = subCategories[catId] || [];
        
        if (subs.length > 0) {
            currentSubCat = subs[0].id;
        } else {
            currentSubCat = catId;
        }
        
        renderMainTabs();
        renderSubCategories();
        renderMenu();
        
        setTimeout(() => {
            centerActiveTab();
            if (subs.length > 0) {
                centerActiveSubCategory();
            }
        }, 200);
    }

    function changeSubCat(subId) {
        currentSubCat = subId;
        renderSubCategories();
        renderMenu();
        
        setTimeout(() => centerActiveSubCategory(), 100);
    }

    function renderMenu() {
        const container = document.getElementById('menuContent');
        const items = menuData.items[currentSubCat] || [];
        
        if (items.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-light);">لا توجد أصناف</div>';
            return;
        }
        
        container.innerHTML = items.map((item, index) => {
            const title = item.ar_title || item.ar;
            const desc = item.ar_desc ? `<div class="item-desc">${item.ar_desc}</div>` : '';
            const imgSrc = item.img || 'https://cdn-icons-png.flaticon.com/512/2805/2805218.webp';
            
            let optionsHTML = '';
            if (item.options) {
                optionsHTML = `<select id="opt-${item.id}">
                    ${item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>`;
            }

            let pHTML = '';
            if (item.priceM) {
                pHTML = `<div class="price-container">
                    ${optionsHTML}
                    <div class="price-buttons">
                        <div id="btn-${item.id}-M" class="price-btn ${getItemQty(item.id, 'M') ? 'selected' : ''}" onclick="addToCartCustom('${item.id}','M',${item.priceM},'M')">
                            <div id="badge-${item.id}-M" class="size-badge" style="display:${getItemQty(item.id,'M') ? 'flex' : 'none'}">${getItemQty(item.id,'M')}</div>
                            <span>وسط</span>
                            <span>${item.priceM} ج</span>
                        </div>
                        <div id="btn-${item.id}-L" class="price-btn ${getItemQty(item.id, 'L') ? 'selected' : ''}" onclick="addToCartCustom('${item.id}','L',${item.priceL},'L')">
                            <div id="badge-${item.id}-L" class="size-badge" style="display:${getItemQty(item.id,'L') ? 'flex' : 'none'}">${getItemQty(item.id,'L')}</div>
                            <span>كبير</span>
                            <span>${item.priceL} ج</span>
                        </div>
                    </div>
                </div>`;
            } else {
                pHTML = `<div class="price-container">
                    ${optionsHTML}
                    <div id="btn-${item.id}-null" class="price-btn ${getItemQty(item.id) ? 'selected' : ''}" onclick="addToCartCustom('${item.id}','',${item.price})" style="width:100%;">
                        <div id="badge-${item.id}-null" class="size-badge" style="display:${getItemQty(item.id) ? 'flex' : 'none'}">${getItemQty(item.id)}</div>
                        <span>${item.price} ج</span>
                    </div>
                </div>`;
            }

            return `<div class="item-card" style="animation-delay: ${index * 0.06}s">
                <div>
                    <img src="${imgSrc}" class="item-img" loading="lazy" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2805/2805218.webp'">
                    <div>
                        <h3>${title}</h3>
                        ${desc}
                    </div>
                </div>
                ${pHTML}
            </div>`;
        }).join('');
    }

    // ===== دوال السلة =====
    function updateSingleBadge(id, size = null) {
        const badge = document.getElementById(`badge-${id}-${size || 'null'}`);
        const btn = document.getElementById(`btn-${id}-${size || 'null'}`);
        const qty = getItemQty(id, size);
        
        if (badge) { 
            badge.innerText = qty; 
            badge.style.display = qty > 0 ? 'flex' : 'none'; 
        }
        if (btn) { 
            if (qty > 0) btn.classList.add('selected'); 
            else btn.classList.remove('selected'); 
        }
    }

    function addToCartCustom(id, label = '', price = null, size = null) {
        const itemData = menuData.items[currentSubCat]?.find(i => i.id === id);
        if (!itemData) return;
        
        const select = document.getElementById(`opt-${id}`);
        const selectedOpt = select ? ` (${select.value})` : '';
        const finalPrice = price || itemData.price;
        const sizeLabel = size ? ` - ${size === 'M' ? 'وسط' : 'كبير'}` : '';
        const nameWithOpt = (itemData.ar_title || itemData.ar) + sizeLabel + selectedOpt;
        
        const found = cart.find(i => i.id === id && i.name === nameWithOpt);
        if (found) {
            found.qty++;
        } else {
            cart.push({ id, name: nameWithOpt, price: finalPrice, qty: 1, size: size });
        }
        
        updateUI();
        updateSingleBadge(id, size);
    }

    function getItemQty(id, size = null) {
        const items = cart.filter(i => i.id === id && (size === null || i.size === size));
        return items.reduce((sum, i) => sum + i.qty, 0);
    }

    function updateUI() {
        const count = cart.reduce((sum, i) => sum + i.qty, 0);
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        
        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = total;
        document.getElementById('modalTotal').innerText = total;
    }

    function openCart() {
        const list = document.getElementById('cartList');
        
        if (cart.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-light);">🛍️ السلة فارغة</div>';
        } else {
            list.innerHTML = cart.map(i => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--border);">
                <div style="flex:1;">
                    <b style="font-size:16px; color:var(--text-dark);">${i.name}</b>
                    <br>
                    <small style="color:var(--text-light);">${i.price} ج × ${i.qty}</small>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <b style="color:var(--primary); font-size:17px;">${i.price * i.qty} ج</b>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button onclick="changeQty('${i.id}','${i.size || 'null'}',-1)" class="cart-item-btn">−</button>
                        <b style="min-width:25px; text-align:center;">${i.qty}</b>
                        <button onclick="changeQty('${i.id}','${i.size || 'null'}',1)" class="cart-item-btn">+</button>
                    </div>
                </div>
            </div>`).join('');
        }
        
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCart() { 
        document.getElementById('cartModal').style.display = 'none'; 
    }

    function changeQty(id, size, delta) {
        const s = size === 'null' ? null : size;
        const itemsWithId = cart.filter(i => i.id === id && i.size === s);
        
        if (itemsWithId.length > 0) {
            const item = itemsWithId[itemsWithId.length - 1]; 
            item.qty += delta;
            
            if (item.qty <= 0) {
                cart = cart.filter(i => i !== item);
            }
            
            updateUI();
            updateSingleBadge(id, s);
            openCart();
        }
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'E' : 'ع';
        renderMainTabs();
        renderSubCategories();
        renderMenu();
    }
    
    function toggleFullScreen() { 
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    function sendWhatsApp() {
        if (cart.length === 0) {
            alert('السلة فارغة');
            return;
        }
        
        let msg = `*☕ طلب جديد من تميم كافيه*\n`;
        msg += `══════════════════\n\n`;
        
        cart.forEach(i => {
            msg += `• *${i.name}*\n`;
            msg += `  الكمية: ${i.qty} | السعر: ${i.price * i.qty} ج\n`;
        });
        
        msg += `\n*💰 الإجمالي: ${document.getElementById('modalTotal').innerText} ج*\n`;
        
        window.open(`https://wa.me/201093438380?text=${encodeURIComponent(msg)}`);
        
        cart = []; 
        updateUI(); 
        renderMenu(); 
        closeCart(); 
    }

    window.addEventListener('resize', () => {
        centerActiveTab();
        if (document.querySelector('.subcategories-container.visible')) {
            centerActiveSubCategory();
        }
    });

    window.onload = () => { 
        renderMainTabs(); 
        renderSubCategories();
        renderMenu(); 
        updateUI(); 
        
        setTimeout(() => {
            centerActiveTab();
            if (document.querySelector('.subcategories-container.visible')) {
                centerActiveSubCategory();
            }
        }, 300);
        
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) { 
                splash.style.opacity = '0'; 
                splash.style.visibility = 'hidden'; 
                setTimeout(() => splash.remove(), 500); 
            }
        }, 2000);
    };
</script>
