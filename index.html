    function renderTabs() {
        const row1 = document.getElementById('navRow1');
        const track = document.getElementById('cinemaTrack');
        const row2 = document.getElementById('cinemaRow');
        row1.innerHTML = menuData.categories.filter(c => !c.isSub).map(cat => 
            `<div class="tab-item ${cat.id === currentCat ? 'active' : ''}" onclick="changeCat('${cat.id}')">${cat[currentLang]}</div>`
        ).join('');
        const subs = menuData.categories.filter(c => c.isSub);
        if (subs.length > 0) {
            track.innerHTML = subs.map(cat => `<div class="tab-item sub-cat ${cat.id === currentCat ? 'active' : ''}" onclick="changeCat('${cat.id}')">${cat[currentLang]}</div>`).join('').repeat(5);
            row2.style.display = 'flex';
        } else row2.style.display = 'none';
    }

    function renderMenu() {
        const container = document.getElementById('menuContent');
        const items = menuData.items[currentCat] || [];
        container.innerHTML = items.map((item, index) => {
            const title = item[currentLang + '_title'] || item[currentLang];
            const desc = item[currentLang + '_desc'] ? `<div style="font-size: 11px; color: #666; max-width:140px; line-height:1.2;">${item[currentLang + '_desc']}</div>` : '';
            const imgSrc = item.img || 'https://cdn-icons-png.flaticon.com/512/1147/1147810.png';
            
            let optionsHTML = '';
            if (item.options) {
                optionsHTML = `<select id="opt-${item.id}" style="margin-bottom:6px; border-radius:8px; border:1.2px solid var(--primary); font-family:'Tajawal'; font-size:11px; width:100%; padding:2px; height:24px;">
                    ${item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>`;
            }

            let pHTML = '';
            if (item.priceM) {
                pHTML = `<div style="display:flex; flex-direction:column; align-items:center; min-width:130px;">
                    ${optionsHTML}
                    <div style="display:flex; gap:6px; width:100%; justify-content:center;">
                        <div id="btn-${item.id}-M" class="price-btn ${getItemQty(item.id, 'M')?'selected':''}" onclick="addToCartCustom('${item.id}','M',${item.priceM},'M')" style="flex:1; min-width:60px;">
                            <div id="badge-${item.id}-M" class="size-badge" style="display:${getItemQty(item.id,'M')?'flex':'none'}">${getItemQty(item.id,'M')}</div>
                            <span style="font-size:10px;">M</span><span style="font-weight:900;">${item.priceM}</span>
                        </div>
                        <div id="btn-${item.id}-L" class="price-btn ${getItemQty(item.id, 'L')?'selected':''}" onclick="addToCartCustom('${item.id}','L',${item.priceL},'L')" style="flex:1; min-width:60px;">
                            <div id="badge-${item.id}-L" class="size-badge" style="display:${getItemQty(item.id,'L')?'flex':'none'}">${getItemQty(item.id,'L')}</div>
                            <span style="font-size:10px;">L</span><span style="font-weight:900;">${item.priceL}</span>
                        </div>
                    </div>
                </div>`;
            } else {
                pHTML = `<div style="display:flex; flex-direction:column; align-items:center; min-width:80px;">
                    ${optionsHTML}
                    <div id="btn-${item.id}-null" class="price-btn ${getItemQty(item.id)?'selected':''}" onclick="addToCartCustom('${item.id}','',${item.price})" style="width:100%;">
                        <div id="badge-${item.id}-null" class="size-badge" style="display:${getItemQty(item.id)?'flex':'none'}">${getItemQty(item.id)}</div>
                        <span style="font-weight:900;">${item.price}</span>
                    </div>
                </div>`;
            }

            return `<div class="item-card" style="animation-delay: ${index * 0.08}s; align-items: flex-end;">
                <div style="display: flex; align-items: center; flex: 1; padding-bottom:5px;">
                    <img src="${imgSrc}" class="item-img" loading="lazy" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1147/1147810.png'">
                    <div><h3 style="margin:0;font-size:14px; color:var(--primary);">${title}</h3>${desc}</div>
                </div>${pHTML}</div>`;
        }).join('');
    }

    function updateSingleBadge(id, size = null) {
        const badge = document.getElementById(`badge-${id}-${size || 'null'}`);
        const btn = document.getElementById(`btn-${id}-${size || 'null'}`);
        const qty = getItemQty(id, size);
        if (badge) { badge.innerText = qty; badge.style.display = qty > 0 ? 'flex' : 'none'; }
        if (btn) { if (qty > 0) btn.classList.add('selected'); else btn.classList.remove('selected'); }
    }

    function addToCartCustom(id, label = '', price = null, size = null) {
        const itemData = menuData.items[currentCat].find(i => i.id === id);
        const select = document.getElementById(`opt-${id}`);
        const selectedOpt = select ? ` (${select.value})` : '';
        const finalPrice = price || itemData.price;
        const sizeLabel = size ? ` - ${size}` : '';
        const nameWithOpt = (itemData[currentLang+'_title'] || itemData[currentLang]) + sizeLabel + selectedOpt;
        
        const found = cart.find(i => i.id === id && i.name === nameWithOpt);
        if (found) found.qty++; 
        else cart.push({ id, name: nameWithOpt, price: finalPrice, qty: 1, size: size });
        
        updateUI();
        updateSingleBadge(id, size);
    }

    function getItemQty(id, size = null) {
        const items = cart.filter(i => i.id === id && (size === null || i.size === size));
        return items.reduce((sum, i) => sum + i.qty, 0);
    }

    function updateUI() {
        const count = cart.reduce((sum, i) => sum + i.qty, 0);
        const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = total;
        document.getElementById('modalTotal').innerText = total;
        document.getElementById('cartBar').style.display = count > 0 ? 'flex' : 'none';
    }

    function changeCat(id) { currentCat = id; renderTabs(); renderMenu(); }
    
    function changeQty(id, size, delta) {
        const s = size === 'null' ? null : size;
        const itemsWithId = cart.filter(i => i.id === id && i.size === s);
        if (itemsWithId.length > 0) {
            const item = itemsWithId[itemsWithId.length - 1]; 
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i !== item);
            updateUI();
            updateSingleBadge(id, s);
            openCart();
        }
    }

    function openCart() {
        const list = document.getElementById('cartList');
        list.innerHTML = cart.map(i => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #eee;">
            <div><b>${i.name}</b><br><small>${i.price} ج.م × ${i.qty}</small></div>
            <div style="display:flex; align-items:center; gap:10px;">
                <b style="color:var(--primary);">${i.price * i.qty} ج.م</b>
                <div style="display:flex; align-items:center; gap:5px;">
                    <button onclick="changeQty('${i.id}','${i.size || 'null'}',-1)" style="width:28px; height:28px; border-radius:5px; border:1px solid #ddd;">-</button>
                    <b style="min-width:20px; text-align:center;">${i.qty}</b>
                    <button onclick="changeQty('${i.id}','${i.size || 'null'}',1)" style="width:28px; height:28px; border-radius:5px; border:1px solid #ddd;">+</button>
                </div>
            </div>
        </div>`).join('') || 'السلة فارغة';
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    
    // تحديث نص الزر بناءً على اللغة الحالية
    const langBtn = document.getElementById('langBtn');
    if (langBtn) {
        langBtn.innerText = currentLang === 'ar' ? 'E' : 'ع';
    }
    
    renderTabs();
    renderMenu();
}
	
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

    function sendWhatsApp() {
        let msg = `*طلب جديد - تميم كافيه*%0A--------------------------%0A`;
        cart.forEach(i => {
            msg += `• *${i.name}*%0Aالكمية: ${i.qty}%0Aالسعر: ${i.price * i.qty} ج.م%0A--------------------------%0A`;
        });
        msg += `%0A*💰 الإجمالي: ${document.getElementById('modalTotal').innerText} ج.م*`; 
        window.open(`https://wa.me/201093438380?text=${msg}`);
        cart = []; updateUI(); renderMenu(); closeCart(); 
    }

    window.onload = () => { 
        renderTabs(); renderMenu(); updateUI(); 
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) { splash.style.opacity = '0'; splash.style.visibility = 'hidden'; setTimeout(() => splash.remove(), 1000); }
        }, 2000);
    };
